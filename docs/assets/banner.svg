<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="AerospaceRL Benchmark: 十个飞行任务，同一张量接口。 Live showcase at paoshou-china.github.io/aerospace-rl-benchmark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080c"/>
      <stop offset="0.55" stop-color="#071320"/>
      <stop offset="1" stop-color="#04101a"/>
    </linearGradient>
    <radialGradient id="glow-c" cx="0.10" cy="0" r="0.72">
      <stop offset="0" stop-color="#4ee1ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4ee1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-g" cx="0.92" cy="1" r="0.62">
      <stop offset="0" stop-color="#7dffc4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7dffc4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ee1ff"/>
      <stop offset="0.55" stop-color="#7dffc4"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ee1ff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7dffc4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4ee1ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="80" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 0H80M0 0V60" fill="none" stroke="#78bedc" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#glow-c)"/>
  <rect width="1280" height="440" fill="url(#glow-g)"/>

  <!-- corner marks -->
  <path d="M40 40v-12h12M1228 40v-12h-12M40 400v12h12M1228 400v12h-12"
        fill="none" stroke="#4ee1ff" stroke-opacity="0.28" stroke-width="1.4"/>

  <!-- orbit motif -->
  <g opacity="0.9">
    <ellipse cx="1010" cy="212" rx="240" ry="134" transform="rotate(-14 1010 212)"
             fill="none" stroke="#4ee1ff" stroke-opacity="0.20" stroke-width="1.4"/>
    <ellipse cx="1010" cy="212" rx="172" ry="92" transform="rotate(-14 1010 212)"
             fill="none" stroke="#4ee1ff" stroke-opacity="0.30" stroke-width="1.2"/>
    <ellipse cx="1010" cy="212" rx="98" ry="50" transform="rotate(-14 1010 212)"
             fill="none" stroke="#7dffc4" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="1010" cy="212" r="4" fill="#4ee1ff" fill-opacity="0.85"/>
    <circle cx="824" cy="266" r="3.6" fill="#4ee1ff"/>
    <circle cx="1166" cy="138" r="3" fill="#7dffc4"/>
    <circle cx="1114" cy="314" r="2.4" fill="#ffd166"/>
  </g>

  <!-- flight path -->
  <path d="M748 322C818 322 872 276 918 226 970 170 1026 128 1102 114"
        fill="none" stroke="#7dffc4" stroke-opacity="0.55" stroke-width="1.6"/>
  <path d="M748 322C818 322 872 276 918 226 970 170 1026 128 1102 114"
        fill="none" stroke="#4ee1ff" stroke-opacity="0.35" stroke-width="6" stroke-dasharray="2 16"/>
  <circle cx="748" cy="322" r="3.2" fill="#4ee1ff"/>
  <path d="M1102 114l16-6-6 16-4-8z" fill="#7dffc4"/>

  <!-- starfield -->
  <g fill="#e8f2f8">
    <circle cx="180" cy="52" r="1.4" fill-opacity="0.5"/>
    <circle cx="292" cy="90" r="1" fill-opacity="0.35"/>
    <circle cx="360" cy="36" r="1.6" fill-opacity="0.55"/>
    <circle cx="520" cy="70" r="1" fill-opacity="0.3"/>
    <circle cx="640" cy="42" r="1.3" fill-opacity="0.45"/>
    <circle cx="72" cy="318" r="1.2" fill-opacity="0.35"/>
    <circle cx="470" cy="392" r="1" fill-opacity="0.3"/>
    <circle cx="880" cy="72" r="1.2" fill-opacity="0.4"/>
    <circle cx="956" cy="368" r="1" fill-opacity="0.35"/>
    <circle cx="1200" cy="60" r="1.4" fill-opacity="0.5"/>
    <circle cx="1246" cy="240" r="1" fill-opacity="0.3"/>
    <circle cx="760" cy="130" r="1" fill-opacity="0.25"/>
  </g>

  <!-- eyebrow -->
  <text x="70" y="88" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="13" letter-spacing="3.6" fill="#4ee1ff">GPU-PARALLEL · AEROSPACE CONTROL · RL</text>

  <!-- headline, mirrors the landing-page hero -->
  <text x="68" y="160" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Inter, Segoe UI, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="0.5" fill="#e8f2f8">十个飞行任务，</text>
  <text x="68" y="220" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Inter, Segoe UI, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="0.5" fill="url(#title)">同一张量接口。</text>

  <!-- English subtitle -->
  <text x="70" y="260" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="16" fill="#9db3c2">Ten aerospace control tasks · one batched device-tensor interface</text>

  <!-- live URL button -->
  <rect x="70" y="280" width="404" height="40" rx="20"
        fill="#0b1620" stroke="#4ee1ff" stroke-opacity="0.45"/>
  <path d="M92 294l12 6-12 6z" fill="#4ee1ff"/>
  <text x="114" y="305" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="12.5" letter-spacing="0.4" fill="#e8f2f8">paoshou-china.github.io/aerospace-rl-benchmark</text>

  <!-- stats strip, same four numbers as the page -->
  <g>
    <rect x="70" y="340" width="560" height="64" rx="12" fill="#0a121a" stroke="#78bedc" stroke-opacity="0.16"/>
    <line x1="210" y1="340" x2="210" y2="404" stroke="#78bedc" stroke-opacity="0.16"/>
    <line x1="350" y1="340" x2="350" y2="404" stroke="#78bedc" stroke-opacity="0.16"/>
    <line x1="490" y1="340" x2="490" y2="404" stroke="#78bedc" stroke-opacity="0.16"/>

    <text x="140" y="374" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="20" fill="#e8f2f8">10</text>
    <text x="140" y="390" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" letter-spacing="1.4" fill="#6d8493">TASKS</text>

    <text x="280" y="374" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="20" fill="#e8f2f8">1024</text>
    <text x="280" y="390" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" letter-spacing="1.4" fill="#6d8493">ENVS</text>

    <text x="420" y="374" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="20" fill="#e8f2f8">0</text>
    <text x="420" y="390" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" letter-spacing="1.4" fill="#6d8493">GYM</text>

    <text x="560" y="374" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="20" fill="#e8f2f8">1</text>
    <text x="560" y="390" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" letter-spacing="1.4" fill="#6d8493">SYNC / STEP</text>
  </g>

  <!-- repo line -->
  <text x="1214" y="420" text-anchor="end"
        font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="12" letter-spacing="0.6" fill="#5c7484">github.com/PaoShou-China/aerospace-rl-benchmark</text>

  <!-- bottom rule -->
  <rect x="0" y="432" width="1280" height="8" fill="url(#rule)" opacity="0.55"/>
</svg>

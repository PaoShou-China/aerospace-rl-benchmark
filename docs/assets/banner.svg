<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="AerospaceRL Benchmark: ten aerospace control tasks behind one batched device-tensor interface">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080c"/>
      <stop offset="0.55" stop-color="#071320"/>
      <stop offset="1" stop-color="#04101a"/>
    </linearGradient>
    <radialGradient id="glow-c" cx="0.10" cy="0" r="0.72">
      <stop offset="0" stop-color="#4ee1ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4ee1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-g" cx="0.92" cy="1" r="0.62">
      <stop offset="0" stop-color="#7dffc4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7dffc4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ee1ff"/>
      <stop offset="0.6" stop-color="#7dffc4"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ee1ff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7dffc4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4ee1ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="80" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 0H80M0 0V60" fill="none" stroke="#78bedc" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow-c)"/>
  <rect width="1280" height="400" fill="url(#glow-g)"/>

  <!-- corner marks -->
  <path d="M40 40v-12h12M1228 40v-12h-12M40 360v12h12M1228 360v12h-12"
        fill="none" stroke="#4ee1ff" stroke-opacity="0.28" stroke-width="1.4"/>

  <!-- orbit motif -->
  <g opacity="0.9">
    <ellipse cx="1020" cy="192" rx="232" ry="128" transform="rotate(-14 1020 192)"
             fill="none" stroke="#4ee1ff" stroke-opacity="0.20" stroke-width="1.4"/>
    <ellipse cx="1020" cy="192" rx="168" ry="88" transform="rotate(-14 1020 192)"
             fill="none" stroke="#4ee1ff" stroke-opacity="0.30" stroke-width="1.2"/>
    <ellipse cx="1020" cy="192" rx="96" ry="48" transform="rotate(-14 1020 192)"
             fill="none" stroke="#7dffc4" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="1020" cy="192" r="4" fill="#4ee1ff" fill-opacity="0.85"/>
    <circle cx="838" cy="248" r="3.6" fill="#4ee1ff"/>
    <circle cx="1172" cy="120" r="3" fill="#7dffc4"/>
    <circle cx="1124" cy="292" r="2.4" fill="#ffd166"/>
  </g>

  <!-- flight path -->
  <path d="M742 306C812 306 872 258 918 210 972 154 1030 116 1108 104"
        fill="none" stroke="#7dffc4" stroke-opacity="0.55" stroke-width="1.6"/>
  <path d="M742 306C812 306 872 258 918 210 972 154 1030 116 1108 104"
        fill="none" stroke="#4ee1ff" stroke-opacity="0.35" stroke-width="6" stroke-dasharray="2 16"/>
  <circle cx="742" cy="306" r="3.2" fill="#4ee1ff"/>
  <path d="M1108 104l16-6-6 16-4-8z" fill="#7dffc4"/>

  <!-- starfield -->
  <g fill="#e8f2f8">
    <circle cx="180" cy="52" r="1.4" fill-opacity="0.5"/>
    <circle cx="292" cy="90" r="1" fill-opacity="0.35"/>
    <circle cx="360" cy="36" r="1.6" fill-opacity="0.55"/>
    <circle cx="520" cy="70" r="1" fill-opacity="0.3"/>
    <circle cx="640" cy="42" r="1.3" fill-opacity="0.45"/>
    <circle cx="72" cy="300" r="1.2" fill-opacity="0.35"/>
    <circle cx="470" cy="352" r="1" fill-opacity="0.3"/>
    <circle cx="880" cy="66" r="1.2" fill-opacity="0.4"/>
    <circle cx="960" cy="330" r="1" fill-opacity="0.35"/>
    <circle cx="1200" cy="60" r="1.4" fill-opacity="0.5"/>
    <circle cx="1246" cy="210" r="1" fill-opacity="0.3"/>
    <circle cx="760" cy="120" r="1" fill-opacity="0.25"/>
  </g>

  <!-- eyebrow -->
  <text x="70" y="92" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="13" letter-spacing="3.6" fill="#4ee1ff">GPU-PARALLEL · AEROSPACE CONTROL · RL</text>

  <!-- title -->
  <text x="68" y="172" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="64" font-weight="700" letter-spacing="-1.6" fill="#e8f2f8">AerospaceRL</text>
  <text x="68" y="236" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="64" font-weight="700" letter-spacing="-0.4" fill="url(#title)">Benchmark</text>

  <!-- subtitle -->
  <text x="70" y="280" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="17" fill="#9db3c2">Ten single-agent tasks · one batched device-tensor interface</text>

  <!-- chips -->
  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12.5" letter-spacing="1.1">
    <rect x="70" y="316" width="112" height="32" rx="16" fill="#0e1a24" stroke="#4ee1ff" stroke-opacity="0.30"/>
    <text x="126" y="337" text-anchor="middle" fill="#9db3c2">10 TASKS</text>

    <rect x="196" y="316" width="164" height="32" rx="16" fill="#0e1a24" stroke="#4ee1ff" stroke-opacity="0.30"/>
    <text x="278" y="337" text-anchor="middle" fill="#9db3c2">6 ATMOSPHERIC</text>

    <rect x="374" y="316" width="148" height="32" rx="16" fill="#0e1a24" stroke="#4ee1ff" stroke-opacity="0.30"/>
    <text x="448" y="337" text-anchor="middle" fill="#9db3c2">4 SPACECRAFT</text>

    <rect x="536" y="316" width="152" height="32" rx="16" fill="#0e1a24" stroke="#4ee1ff" stroke-opacity="0.30"/>
    <text x="612" y="337" text-anchor="middle" fill="#9db3c2">1 SYNC / STEP</text>
  </g>

  <!-- repo line -->
  <text x="1214" y="374" text-anchor="end"
        font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="12" letter-spacing="0.6" fill="#5c7484">github.com/PaoShou-China/aerospace-rl-benchmark</text>

  <!-- bottom rule -->
  <rect x="0" y="392" width="1280" height="8" fill="url(#rule)" opacity="0.55"/>
</svg>
